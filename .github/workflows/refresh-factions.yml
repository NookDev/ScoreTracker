name: Refresh faction data

on:
  schedule:
    - cron: '0 6 * * *'   # Every day at 06:00 UTC
  workflow_dispatch:        # Allow manual trigger from Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install pyyaml

      - name: Run refresh script
        run: python scripts/refresh-factions.py

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes, skipping commit."
          else
            TODAY_LONG=$(date -u '+%-d %b %Y')
            TODAY_SHORT=$(date -u '+%Y-%m-%d')

            # Find which factions had detachment changes
            CHANGED=$(python3 - <<'PYEOF'
import re, subprocess, json, sys

def extract(text):
    m = re.search(r'const DETACHMENTS=(\{.*?\});', text)
    return json.loads(m.group(1)) if m else {}

try:
    old = subprocess.check_output(['git', 'show', 'HEAD:index.html']).decode('utf-8')
except:
    sys.exit(0)

with open('index.html', encoding='utf-8') as f:
    new = f.read()

old_d = extract(old)
new_d = extract(new)
changed = sorted(f for f in set(list(old_d) + list(new_d)) if old_d.get(f) != new_d.get(f))
if changed:
    print(', '.join(changed))
PYEOF
            )

            # Bump the "Updated" date
            sed -i "s|<div class=\"updated-note\">Updated .*</div>|<div class=\"updated-note\">Updated ${TODAY_LONG}</div>|" index.html

            # Prepend a changelog entry
            ENTRY="      <div style=\"font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;color:var(--bone-dim);\">\\n        <span style=\"color:var(--brass);margin-right:8px;\">${TODAY_SHORT}<\\/span>Detachments updated: ${CHANGED}\\n      <\\/div>"
            sed -i "s|<div class=\"entry-more-body\".*>|&\n${ENTRY}|" index.html

            git add index.html
            git commit -m "chore: refresh BSData faction snapshot (${TODAY_SHORT}) — ${CHANGED}"
            git push

            # Deploy updated index.html to live server
            mkdir -p ~/.ssh
            echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh-keyscan -p 22 103.249.238.92 >> ~/.ssh/known_hosts
            scp -i ~/.ssh/deploy_key -P 22 index.html scoret@103.249.238.92:/home/scoret/public_html/index.html
          fi
